name: Notify IndexNow

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  submit:
    # Vercel labels this site's deployments Production; its production_environment
    # flag is false even for production, so use the verified environment name.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip superseded deployments
        id: latest
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skipping this deployment."
          fi
      - uses: actions/cache/restore@v4
        if: steps.latest.outputs.current == 'true'
        with:
          path: .indexnow/state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-
      - name: Test URL selection and submission safeguards
        if: steps.latest.outputs.current == 'true'
        run: python3 -m unittest discover -s scripts -p 'test_indexnow.py'
      - name: Submit live URLs
        if: steps.latest.outputs.current == 'true'
        run: python3 scripts/indexnow.py
      - uses: actions/cache/save@v4
        if: steps.latest.outputs.current == 'true'
        with:
          path: .indexnow/state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
