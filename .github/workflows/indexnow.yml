name: Notify IndexNow

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Production commit supplied by the deployment handoff
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  dispatch:
    # Cache is unavailable on deployment_status events (no branch ref).
    # Dispatch onto main so submission runs can restore and save their baseline.
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start main-branch submission for the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        run: |
          latest=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$DEPLOYED_SHA" = "$latest" ]; then
            gh workflow run indexnow.yml --ref main -f "deployed_sha=$DEPLOYED_SHA"
          else
            echo "Skipping superseded deployment."
          fi

  submit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployed_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip superseded deployments
        id: latest
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skipping this deployment."
          fi
      - uses: actions/cache/restore@v4
        if: steps.latest.outputs.current == 'true'
        with:
          path: .indexnow/state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-
      - name: Test URL selection and submission safeguards
        if: steps.latest.outputs.current == 'true'
        run: python3 -m unittest discover -s scripts -p 'test_indexnow.py'
      - name: Submit live URLs
        if: steps.latest.outputs.current == 'true'
        run: python3 scripts/indexnow.py
      - uses: actions/cache/save@v4
        if: steps.latest.outputs.current == 'true'
        with:
          path: .indexnow/state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
